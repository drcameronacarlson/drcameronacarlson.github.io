<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature graphic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #0b161d; }
.wrap { position: relative; width: 1024px; height: 500px; display: flex; align-items: center; }
.text { position: relative; z-index: 2; padding-left: 64px; width: 520px; }
.kicker { font: 500 15px/1 "IBM Plex Mono", monospace; letter-spacing: .18em; color: #3cc0b4; text-transform: uppercase; }
h1 { margin: 16px 0 14px; font: 700 86px/.92 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; text-transform: uppercase; color: #eef5f7; }
h1 span { color: #ffc15e; }
p { margin: 0; font: 600 25px/1.3 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .04em; color: #9fb6c0; text-transform: uppercase; }
svg { position: absolute; right: -40px; top: -20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="text">
    <div class="kicker">Relative motion · Stationing · DIVTACS</div>
    <h1>MoBoard<br><span>Bridge</span> Trainer</h1>
    <p>Solve it on the board. Watch it on the bridge.</p>
  </div>
  <svg width="560" height="560" viewBox="-280 -280 560 560" aria-hidden="true">
    <defs>
      <radialGradient id="scope"><stop offset="0" stop-color="#0c2a22"/><stop offset="1" stop-color="#06140f"/></radialGradient>
      <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8dffb4" stop-opacity="0"/><stop offset="1" stop-color="#8dffb4" stop-opacity=".28"/></linearGradient>
    </defs>
    <circle r="250" fill="url(#scope)"/>
    <g fill="none" stroke="#8dffb4" stroke-opacity=".2">
      <circle r="50"/><circle r="100"/><circle r="150"/><circle r="200"/><circle r="250" stroke-opacity=".5" stroke-width="2"/>
      <path d="M0-250V250M-250 0H250M-177-177L177 177M-177 177L177-177"/>
    </g>
    <path d="M0 0L0-250A250 250 0 0 1 144-204Z" fill="url(#sweep)" transform="rotate(20)"/>
    <line x1="0" y1="0" x2="95" y2="-231" stroke="#8dffb4" stroke-opacity=".75" stroke-width="2"/>
    <!-- relative motion line with plotted fixes -->
    <!-- RML: direction (-0.753, 0.659); CPA is the perpendicular foot at (-29,-33) -->
    <line x1="144" y1="-185" x2="-150" y2="73" stroke="#3cc0b4" stroke-width="3.5"/>
    <polygon points="-157,79 -138.1,73.1 -148.7,61.1" fill="#3cc0b4"/>
    <circle cx="144" cy="-185" r="7" fill="#3cc0b4"/><circle cx="91.5" cy="-138" r="7" fill="#3cc0b4"/>
    <line x1="0" y1="0" x2="-29" y2="-33" stroke="#9fb6c0" stroke-dasharray="4 5" stroke-width="2"/>
    <circle cx="-29" cy="-33" r="6" fill="none" stroke="#ffc15e" stroke-width="3"/>
    <!-- speed triangle -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#74a9ff" stroke-width="4"/>
    <line x1="0" y1="-120" x2="-95" y2="-38" stroke="#4fd6a6" stroke-width="4"/>
    <line x1="0" y1="0" x2="-95" y2="-38" stroke="#ff7f7f" stroke-width="4"/>
    <g font-family="IBM Plex Mono, monospace" font-size="17" font-weight="500">
      <text x="156" y="-190" fill="#cfe9e4">M1</text><text x="103" y="-143" fill="#cfe9e4">M2</text><text x="-72" y="-44" fill="#ffc15e">CPA</text>
      <text x="8" y="-124" fill="#74a9ff">r</text><text x="-113" y="-32" fill="#ff7f7f">m</text>
    </g>
    <circle r="5" fill="#8dffb4"/>
  </svg>
</div>
</body>
</html>
